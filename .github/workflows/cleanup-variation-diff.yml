name: Clean variation selector diff

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-variation-diff.yml'

permissions:
  contents: write

jobs:
  clean-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore pre-format source style
        shell: bash
        run: |
          git checkout c4fe5f9e360bf13690a0d07a29d06ca50e4b66ff -- analysis_options.yaml pubspec.lock lib/common/widgets/item_bottom_sheet.dart lib/features/item/controllers/item_controller.dart lib/features/item/screens/item_details_screen.dart lib/features/item/widgets/variation_selector_widget.dart
          python3 .github/scripts/clean_variation_patch.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze variation flow
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/features/item/controllers/item_controller.dart lib/features/item/screens/item_details_screen.dart lib/common/widgets/item_bottom_sheet.dart lib/features/item/widgets/variation_selector_widget.dart

      - name: Commit minimal validated diff
        shell: bash
        run: |
          git checkout c4fe5f9e360bf13690a0d07a29d06ca50e4b66ff -- analysis_options.yaml pubspec.lock
          rm -f .github/scripts/clean_variation_patch.py
          rm -f .github/workflows/cleanup-variation-diff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: keep variation fix diff minimal"
          git push origin HEAD:main
