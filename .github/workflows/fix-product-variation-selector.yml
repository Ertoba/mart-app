                                    Expanded(
                                      child: Text(
                                        widget.title,
                                        maxLines: 1,
                                        overflow: TextOverflow.ellipsis,
                                        style: robotoBold.copyWith(fontSize: Dimensions.fontSizeLarge),
                                      ),
                                    ),
                                    SizedBox(
                                      width: 44,
