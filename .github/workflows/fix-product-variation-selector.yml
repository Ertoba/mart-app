name: Apply product variation selector fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-product-variation-selector.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch variation flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 literal match, found {count}')
              p.write_text(text.replace(old, new, 1))

          def sub_once(path, pattern, replacement):
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 regex match, found {count}')
              p.write_text(updated)

          controller = 'lib/features/item/controllers/item_controller.dart'
          details = 'lib/features/item/screens/item_details_screen.dart'
          sheet = 'lib/common/widgets/item_bottom_sheet.dart'
          selector = Path('lib/features/item/widgets/variation_selector_widget.dart')

          replace_once(
              controller,
              "  List<int>? _variationIndex;\n  List<int>? get variationIndex => _variationIndex;\n",
              """  List<int>? _variationIndex;
  List<int>? get variationIndex => _variationIndex;

  List<bool> _variationSelectionConfirmed = [];

  bool isVariationSelectionConfirmed(int index) {
    return index >= 0 &&
        index < _variationSelectionConfirmed.length &&
        _variationSelectionConfirmed[index];
  }

  bool areVariationsSelected(Item? item) {
    if (item == null ||
        (ModuleHelper.getModuleConfig(item.moduleType).newVariation ?? false)) {
      return true;
    }
    final int choiceCount = item.choiceOptions?.length ?? 0;
    if (choiceCount == 0) {
      return true;
    }
    return _variationSelectionConfirmed.length == choiceCount &&
        _variationSelectionConfirmed.every((selected) => selected);
  }

  String? firstUnselectedVariationTitle(Item? item) {
    if (item == null ||
        (ModuleHelper.getModuleConfig(item.moduleType).newVariation ?? false)) {
      return null;
    }
    for (int index = 0; index < (item.choiceOptions?.length ?? 0); index++) {
      if (!isVariationSelectionConfirmed(index)) {
        return item.choiceOptions![index].title;
      }
    }
    return null;
  }
""",
          )

          replacement_block = r'''  Future<void> getItemDetails({required int itemId, CartModel? cart, bool isCampaign = false}) async {
    _item = null;
    _item = await itemServiceInterface.getItemDetails(itemId, isCampaign);

    if(_item != null) {
      initData(_item, cart);
      final bool newVariation = ModuleHelper.getModuleConfig(_item!.moduleType).newVariation ?? false;
      if(newVariation || areVariationsSelected(_item) || (_item!.choiceOptions?.isEmpty ?? true)) {
        await setExistInCart(_item, _selectedVariations);
      } else {
        _cartIndex = -1;
      }
    }

    update();
  }

  void initData(Item? item, CartModel? cart) {
    _variationIndex = [];
    _variationSelectionConfirmed = [];
    _addOnQtyList = [];
    _addOnActiveList = [];
    _selectedVariations = [];
    _collapseVariation = [];
    if(cart != null) {
      _quantity = cart.quantity;
      _addOnActiveList.addAll(itemServiceInterface.initializeCartAddonActiveList(cart.addOnIds, item!.addOns));
      _addOnQtyList.addAll(itemServiceInterface.initializeCartAddonsQtyList(cart.addOnIds, item.addOns));

      if(ModuleHelper.getModuleConfig(item.moduleType).newVariation!) {
        _selectedVariations.addAll(cart.foodVariations!);
        _collapseVariation.addAll(itemServiceInterface.collapseVariation(item.foodVariations!));
      }else {
        final List<int>? cartVariationIndexes = _findCartVariationIndexes(item, cart);
        if(cartVariationIndexes != null) {
          _variationIndex = cartVariationIndexes;
          _variationSelectionConfirmed = List<bool>.filled(item.choiceOptions?.length ?? 0, true);
        } else {
          _variationIndex = itemServiceInterface.initializeVariationIndexes(item.choiceOptions);
          _variationSelectionConfirmed = List<bool>.filled(item.choiceOptions?.length ?? 0, false);
          _cartIndex = -1;
        }
      }
    } else {
      if(ModuleHelper.getModuleConfig(item!.moduleType).newVariation!) {
        _selectedVariations.addAll(itemServiceInterface.initializeSelectedVariation(item.foodVariations));
        _collapseVariation.addAll(itemServiceInterface.initializeCollapseVariation(item.foodVariations));
      } else {
        _variationIndex = itemServiceInterface.initializeVariationIndexes(item.choiceOptions);
        _variationSelectionConfirmed = List<bool>.filled(item.choiceOptions?.length ?? 0, false);
      }
      _quantity = 1;
      _addOnActiveList.addAll(itemServiceInterface.initializeAddonActiveList(item.addOns));
      _addOnQtyList.addAll(itemServiceInterface.initializeAddonQtyList(item.addOns));
    }
  }

  List<int>? _findCartVariationIndexes(Item item, CartModel cart) {
    final List<ChoiceOptions> choices = item.choiceOptions ?? <ChoiceOptions>[];
    if(choices.isEmpty) {
      return <int>[];
    }
    final String target = cart.variation != null && cart.variation!.isNotEmpty
        ? (cart.variation!.first.type ?? '').trim()
        : '';
    if(target.isEmpty) {
      return null;
    }

    final List<int> working = List<int>.filled(choices.length, 0);
    List<int>? match;

    void search(int depth) {
      if(match != null) {
        return;
      }
      if(depth == choices.length) {
        final List<String> parts = <String>[];
        for(int index = 0; index < choices.length; index++) {
          final List<String> options = choices[index].options ?? <String>[];
          if(options.isEmpty || working[index] >= options.length) {
            return;
          }
          parts.add(_canonicalVariationValue(options[working[index]]));
        }
        if(parts.join('-') == target) {
          match = List<int>.from(working);
        }
        return;
      }

      final List<String> options = choices[depth].options ?? <String>[];
      for(int index = 0; index < options.length; index++) {
        working[depth] = index;
        search(depth + 1);
        if(match != null) {
          return;
        }
      }
    }

    search(0);
    return match;
  }

  String _canonicalVariationValue(String value) {
    return value.replaceAll(RegExp(r'\s+'), '');
  }

'''
