          class VariationSelectorWidget extends StatelessWidget {
            final Item item;
            final ItemController itemController;

            const VariationSelectorWidget({
              super.key,
              required this.item,
              required this.itemController,
            });

            @override
            Widget build(BuildContext context) {
              final List<ChoiceOptions> choices = item.choiceOptions ?? <ChoiceOptions>[];
              if(choices.isEmpty) {
                return const SizedBox();
              }

              return ListView.separated(
                shrinkWrap: true,
                physics: const NeverScrollableScrollPhysics(),
                padding: const EdgeInsets.only(bottom: Dimensions.paddingSizeLarge),
                itemCount: choices.length,
                separatorBuilder: (_, __) => const SizedBox(height: Dimensions.paddingSizeDefault),
                itemBuilder: (context, index) {
