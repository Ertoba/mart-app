      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format
        run: dart format lib/features/item/controllers/item_controller.dart lib/features/item/screens/item_details_screen.dart lib/common/widgets/item_bottom_sheet.dart lib/features/item/widgets/variation_selector_widget.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze changed Dart files
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/features/item/controllers/item_controller.dart lib/features/item/screens/item_details_screen.dart lib/common/widgets/item_bottom_sheet.dart lib/features/item/widgets/variation_selector_widget.dart

      - name: Commit to main
        shell: bash
        run: |
          rm -f .github/workflows/fix-product-variation-selector.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: add safe searchable product variation selection"
          git push origin HEAD:main
