name: Keepz payment flow correction

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/keepz-existing-order-flow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/keepz-existing-order-flow
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Patch Keepz existing-order payment flow
        run: python3 .github/keepz_patch.py

      - name: Format and analyze Keepz-only changes
        shell: bash
        run: |
          dart format lib/features/payment/services/keepz_order_payment_service.dart lib/features/payment/screens/keepz_native_payment_screen.dart lib/features/checkout/controllers/checkout_controller.dart lib/features/checkout/screens/digital_payment_failed_screen.dart lib/features/checkout/widgets/payment_failed_dialog.dart
          flutter pub get
          flutter analyze lib/features/payment/services/keepz_order_payment_service.dart lib/features/payment/screens/keepz_native_payment_screen.dart lib/features/checkout/controllers/checkout_controller.dart lib/features/checkout/screens/digital_payment_failed_screen.dart lib/features/checkout/widgets/payment_failed_dialog.dart
          python3 - <<'PY'
          from pathlib import Path
          service = Path('lib/features/payment/services/keepz_order_payment_service.dart').read_text()
          payment = Path('lib/features/payment/screens/keepz_native_payment_screen.dart').read_text()
          checkout = Path('lib/features/checkout/controllers/checkout_controller.dart').read_text()
          failed = Path('lib/features/checkout/screens/digital_payment_failed_screen.dart').read_text()
          checks = {
              'prepare existing order': '/prepare-retry' in service,
              'safe COD switch': '/switch-to-cod' in service,
              'close routes to failure page': "pop('cancel')" in payment,
              'preflight before Keepz intent': 'KeepzOrderPaymentService.prepareRetry' in payment,
              'retry does not recreate order': "keepzStatus != 'success'" in checkout,
              'failed page back guard': 'canPop: !_isKeepzPayment' in failed,
              'new app version': 'version: 3.8.13+41' in Path('pubspec.yaml').read_text(),
          }
          bad = [name for name, ok in checks.items() if not ok]
          if bad:
              raise SystemExit('Invariant checks failed: ' + ', '.join(bad))
          PY

      - name: Commit correction to the pull request branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/keepz-payment-flow-fix.yml
          git rm .github/keepz_patch.py
          git rm .github/keepz-payment-flow-trigger
          git add lib/features/payment/services/keepz_order_payment_service.dart lib/features/payment/screens/keepz_native_payment_screen.dart lib/features/checkout/controllers/checkout_controller.dart lib/features/checkout/screens/digital_payment_failed_screen.dart lib/features/checkout/widgets/payment_failed_dialog.dart pubspec.yaml
          git commit -m "Keep Keepz retries on the existing order"
          git push origin HEAD:fix/keepz-existing-order-flow
