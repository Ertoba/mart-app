name: Keepz payment flow hardening

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write

jobs:
  harden:
    if: github.head_ref == 'fix/keepz-existing-order-flow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/keepz-existing-order-flow
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Harden async close and payment-page navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          payment_path = Path('lib/features/payment/screens/keepz_native_payment_screen.dart')
          payment = payment_path.read_text()

          paid_target = """      if (preparation.isPaid) {
"""
          paid_replacement = """      if (!mounted) {
        return;
      }
      if (preparation.isPaid) {
"""
          if payment.count(paid_target) != 2:
              raise SystemExit(f'expected 2 preparation paid checks, found {payment.count(paid_target)}')
          payment = payment.replace(paid_target, paid_replacement)

          pattern = re.compile(r"(      final _KeepzIntent intent = await _fetchIntent\(\n(?:.|\n)*?      \);\n)(\n      final bool shouldTryExternal =)")
          payment, count = pattern.subn(r"\1\n      if (!mounted) {\n        return;\n      }\2", payment)
          if count != 2:
              raise SystemExit(f'expected 2 post-intent mounted guards, found {count}')
          payment_path.write_text(payment)

          failed_path = Path('lib/features/checkout/screens/digital_payment_failed_screen.dart')
          failed = failed_path.read_text()
          old = """  bool _isKeepzPayment = false;
"""
          new = """  bool _isKeepzPayment = false;
  bool _paymentDetailsLoaded = false;
"""
          if failed.count(old) != 1:
              raise SystemExit('payment-details state target mismatch')
          failed = failed.replace(old, new, 1)

          old = """      _isKeepzPayment = paymentModel?.paymentMethod == 'keepz';
"""
          new = """      _isKeepzPayment = paymentModel?.paymentMethod == 'keepz';
      _paymentDetailsLoaded = true;
"""
          if failed.count(old) != 1:
              raise SystemExit('payment-details completion target mismatch')
          failed = failed.replace(old, new, 1)

          old = """      canPop: !_isKeepzPayment,
"""
          new = """      canPop: _paymentDetailsLoaded && !_isKeepzPayment,
"""
          if failed.count(old) != 1:
              raise SystemExit('payment-page back guard target mismatch')
          failed_path.write_text(failed.replace(old, new, 1))
          PY

      - name: Format and validate focused Keepz files
        shell: bash
        run: |
          dart format lib/features/payment/screens/keepz_native_payment_screen.dart lib/features/checkout/screens/digital_payment_failed_screen.dart
          flutter pub get
          flutter analyze --no-fatal-infos lib/features/payment/screens/keepz_native_payment_screen.dart lib/features/checkout/screens/digital_payment_failed_screen.dart lib/features/payment/services/keepz_order_payment_service.dart
          python3 - <<'PY'
          from pathlib import Path
          payment = Path('lib/features/payment/screens/keepz_native_payment_screen.dart').read_text()
          failed = Path('lib/features/checkout/screens/digital_payment_failed_screen.dart').read_text()
          if payment.count('if (!mounted) {') < 8:
              raise SystemExit('missing Keepz mounted guards')
          if 'canPop: _paymentDetailsLoaded && !_isKeepzPayment' not in failed:
              raise SystemExit('missing payment-page navigation guard')
          if '_paymentDetailsLoaded = true;' not in failed:
              raise SystemExit('missing payment-details completion state')
          PY

      - name: Commit hardening and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch .github/workflows/keepz-payment-flow-fix.yml
          git rm -f --ignore-unmatch .github/workflows/keepz-review-hardening.yml
          git rm -f --ignore-unmatch .github/keepz-review-trigger
          git add lib/features/payment/screens/keepz_native_payment_screen.dart lib/features/checkout/screens/digital_payment_failed_screen.dart
          git commit -m "Harden Keepz payment page lifecycle"
          git push origin HEAD:fix/keepz-existing-order-flow
