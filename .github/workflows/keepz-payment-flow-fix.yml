name: Keepz payment flow correction

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.event.issue.title == 'Run Keepz payment flow correction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Patch Keepz retry and payment page flow
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/patch_keepz.py
          python3 /tmp/patch_keepz.py

      - name: Format and analyze changed Keepz files
        shell: bash
        run: |
          dart format \
            lib/features/payment/screens/keepz_native_payment_screen.dart \
            lib/features/checkout/controllers/checkout_controller.dart \
            lib/features/checkout/screens/digital_payment_failed_screen.dart \
            lib/features/checkout/widgets/payment_failed_dialog.dart
          flutter pub get
          flutter analyze \
            lib/features/payment/screens/keepz_native_payment_screen.dart \
            lib/features/checkout/controllers/checkout_controller.dart \
            lib/features/checkout/screens/digital_payment_failed_screen.dart \
            lib/features/checkout/widgets/payment_failed_dialog.dart
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              'prepare-retry endpoint': '/prepare-retry' in Path('lib/features/payment/screens/keepz_native_payment_screen.dart').read_text(),
              'safe COD endpoint': '/switch-to-cod' in Path('lib/features/payment/screens/keepz_native_payment_screen.dart').read_text(),
              'Keepz close returns cancel': "pop('cancel')" in Path('lib/features/payment/screens/keepz_native_payment_screen.dart').read_text(),
              'failed page back guard': 'canPop: !_isKeepzPayment' in Path('lib/features/checkout/screens/digital_payment_failed_screen.dart').read_text(),
              'failed retry clears cart on success': 'onPaymentSuccess:' in Path('lib/features/checkout/controllers/checkout_controller.dart').read_text(),
              'version 3.8.13+41': 'version: 3.8.13+41' in Path('pubspec.yaml').read_text(),
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Invariant checks failed: ' + ', '.join(failed))
          PY

      - name: Commit correction and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/keepz-payment-flow-fix.yml
          git add \
            lib/features/payment/screens/keepz_native_payment_screen.dart \
            lib/features/checkout/controllers/checkout_controller.dart \
            lib/features/checkout/screens/digital_payment_failed_screen.dart \
            lib/features/checkout/widgets/payment_failed_dialog.dart \
            pubspec.yaml
          git commit -m "Keep Keepz retries on the existing order"
          git push origin main
