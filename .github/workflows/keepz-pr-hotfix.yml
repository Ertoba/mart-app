name: Keepz status PR hotfix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  patch-and-validate:
    if: github.head_ref == 'fix/keepz-authoritative-status-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply authoritative Keepz status patch
        run: python3 .github/scripts/keepz_status_patch.py

      - name: Format and analyze
        shell: bash
        run: |
          dart format lib/features/payment/screens/keepz_native_payment_screen.dart
          flutter pub get
          flutter analyze lib/features/payment/screens/keepz_native_payment_screen.dart
          python3 <<'PY'
          from pathlib import Path
          text = Path('lib/features/payment/screens/keepz_native_payment_screen.dart').read_text()
          checks = {
              'authoritative endpoint': '/api/v1/customer/order-payment/$orderId/status' in text,
              'no COD-is-paid rule': "order.paymentMethod == 'cash_on_delivery'" not in text,
              'no partial-is-paid rule': "order.paymentMethod == 'partial_payment'" not in text,
              'no wallet-is-paid rule': "order.paymentMethod == 'wallet'" not in text,
              'superseded handling': "status == 'superseded'" in text,
              'ApiClient status call': 'Get.find<ApiClient>()' in text,
              'version bump': 'version: 3.8.12+40' in Path('pubspec.yaml').read_text(),
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Invariant checks failed: ' + ', '.join(failed))
          PY

      - name: Commit source fix and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/keepz-status-hotfix.yml
          git rm .github/workflows/keepz-status-issue-trigger.yml
          git rm .github/workflows/keepz-pr-hotfix.yml
          git rm .github/scripts/keepz_status_patch.py
          git add lib/features/payment/screens/keepz_native_payment_screen.dart pubspec.yaml
          git commit -m "Use authoritative Keepz payment status"
          git push origin HEAD:${{ github.head_ref }}
