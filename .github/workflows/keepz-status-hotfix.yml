name: Keepz status hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/keepz-status-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Patch authoritative Keepz status handling
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          def sub_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return updated

          path = Path('lib/features/payment/screens/keepz_native_payment_screen.dart')
          text = path.read_text()

          text = replace_once(
              text,
              "import 'package:sixam_mart/common/widgets/custom_button.dart';",
              "import 'package:sixam_mart/api/api_client.dart';\nimport 'package:sixam_mart/common/widgets/custom_button.dart';",
              'ApiClient import',
          )
          text = replace_once(
              text,
              "import 'package:sixam_mart/features/order/controllers/order_controller.dart';\n",
              '',
              'unused OrderController import',
          )

          text = replace_once(
              text,
              """    if (status != null) {
      if (status == 'success' && onPaymentSuccess != null) {
        await onPaymentSuccess();
      }
      _navigateOrderPaymentResult(
        status: status,
        orderId: orderModel.id.toString(),
        contactNumber: contactNumber,
        createAccount: createAccount,
        guestId: guestId,
      );
    }
""",
              """    if (status != null && status != 'superseded') {
      if (status == 'success' && onPaymentSuccess != null) {
        await onPaymentSuccess();
      }
      _navigateOrderPaymentResult(
        status: status,
        orderId: orderModel.id.toString(),
        contactNumber: contactNumber,
        createAccount: createAccount,
        guestId: guestId,
      );
    }
""",
              'launcher superseded handling',
          )

          authoritative_reader = """  static Future<String?> _readClosedOrderPaymentStatus({
    required String orderId,
    required String guestId,
  }) async {
    final ApiClient apiClient = Get.find<ApiClient>();
    final String guestQuery = guestId.isNotEmpty
        ? '?guest_id=${Uri.encodeQueryComponent(guestId)}'
        : '';
    const List<int> retryDelaysMs = <int>[0, 500, 900, 1400];

    for (final int delayMs in retryDelaysMs) {
      if (delayMs > 0) {
        await Future<void>.delayed(Duration(milliseconds: delayMs));
      }

      final response = await apiClient.getData(
        '/api/v1/customer/order-payment/$orderId/status$guestQuery',
        handleError: false,
      );
      final dynamic body = response.body;

      if (body is Map) {
        final String state = body['state']?.toString().toLowerCase() ?? '';
        final String paymentStatus =
            body['payment_status']?.toString().toLowerCase() ?? '';
        final String paymentMethod =
            body['payment_method']?.toString().toLowerCase() ?? '';

        if (state == 'paid' || paymentStatus == 'paid') {
          return 'success';
        }

        if (state == 'superseded' ||
            (paymentMethod.isNotEmpty &&
                paymentMethod != 'digital_payment' &&
                paymentMethod != 'keepz')) {
          return 'superseded';
        }

        if (state == 'terminal' || state == 'ready') {
          return 'fail';
        }
      }
    }

    return null;
  }

"""
          text = sub_once(
              text,
              r"  static Future<String\?> _readClosedOrderPaymentStatus\(\{.*?\n  \}\n\n  static bool _isPaidOrder\(OrderModel order\) \{.*?\n  \}\n\n(?=  static void _navigateOrderPaymentResult)",
              authoritative_reader,
              'authoritative status reader',
          )

          call_pattern = re.compile(
              r"(KeepzPaymentLauncher\._readClosedOrderPaymentStatus\(\n"
              r"(?P<indent>\s+)orderId: widget\.orderModel\.id\.toString\(\),\n"
              r"(?P=indent)contactNumber: widget\.contactNumber,\n)"
              r"(?P=indent)\)",
              re.S,
          )

          def replace_call(match: re.Match) -> str:
              indent = match.group('indent')
              return (
                  "KeepzPaymentLauncher._readClosedOrderPaymentStatus(\n"
                  f"{indent}orderId: widget.orderModel.id.toString(),\n"
                  f"{indent}guestId: widget.guestId,\n"
                  f"{indent})"
              )

          text, call_count = call_pattern.subn(replace_call, text)
          if call_count != 3:
              raise SystemExit(
                  f'authoritative status call sites: expected 3 matches, found {call_count}'
              )

          text = replace_once(
              text,
              """    if (Get.isBottomSheetOpen == true) {
      Get.back();
    }

    if (status == 'success') {
""",
              """    if (Get.isBottomSheetOpen == true) {
      Get.back();
    }

    if (status == 'superseded') {
      return;
    }

    if (status == 'success') {
""",
              'static navigation superseded guard',
          )

          instance_resolver = """  Future<void> _resolveClosedOrderPayment() async {
    if (_checkingStatus || !Get.currentRoute.startsWith(RouteHelper.payment)) {
      return;
    }

    setState(() {
      _checkingStatus = true;
    });

    final String? status =
        await KeepzPaymentLauncher._readClosedOrderPaymentStatus(
          orderId: widget.orderModel.id.toString(),
          guestId: widget.guestId,
        );

    if (!mounted) {
      return;
    }

    if (status == 'success' || status == 'fail') {
      _navigateOrderPaymentResult(status!);
      return;
    }

    if (status == 'superseded') {
      setState(() {
        _checkingStatus = false;
        _statusMessage =
            'გადახდის მეთოდი შეიცვალა. წინა საბანკო გადახდა აღარ არის აქტიური.';
      });
      return;
    }

    setState(() {
      _checkingStatus = false;
      _statusMessage =
          'გადახდა ჯერ არ დადასტურებულა. საჭიროების შემთხვევაში სტატუსი ხელახლა გადაამოწმე.';
    });
  }

"""
          text = sub_once(
              text,
              r"  Future<void> _resolveClosedOrderPayment\(\) async \{.*?\n  \}\n\n  bool _isPaidOrder\(OrderModel order\) \{.*?\n  \}\n\n(?=  void _navigateOrderPaymentResult)",
              instance_resolver,
              'instance status resolver',
          )

          text = replace_once(
              text,
              """  void _navigateOrderPaymentResult(String status) {
    if (!Get.currentRoute.startsWith(RouteHelper.payment)) {
      return;
    }

    if (status == 'success') {
""",
              """  void _navigateOrderPaymentResult(String status) {
    if (!Get.currentRoute.startsWith(RouteHelper.payment)) {
      return;
    }

    if (status == 'superseded') {
      if (mounted) {
        setState(() {
          _checkingStatus = false;
          _statusMessage =
              'გადახდის მეთოდი შეიცვალა. წინა საბანკო გადახდა აღარ არის აქტიური.';
        });
      }
      return;
    }

    if (status == 'success') {
""",
              'instance navigation superseded guard',
          )

          path.write_text(text)

          pubspec_path = Path('pubspec.yaml')
          pubspec = pubspec_path.read_text()
          pubspec = replace_once(
              pubspec,
              'version: 3.8.11+39',
              'version: 3.8.12+40',
              'app version bump',
          )
          pubspec_path.write_text(pubspec)
          PY

      - name: Format and analyze
        shell: bash
        run: |
          dart format lib/features/payment/screens/keepz_native_payment_screen.dart
          flutter pub get
          flutter analyze lib/features/payment/screens/keepz_native_payment_screen.dart
          python3 <<'PY'
          from pathlib import Path
          text = Path('lib/features/payment/screens/keepz_native_payment_screen.dart').read_text()
          checks = {
              'authoritative endpoint': '/api/v1/customer/order-payment/$orderId/status' in text,
              'no COD-is-paid rule': "order.paymentMethod == 'cash_on_delivery'" not in text,
              'superseded handling': "status == 'superseded'" in text,
              'ApiClient status call': 'Get.find<ApiClient>()' in text,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Invariant checks failed: ' + ', '.join(failed))
          PY

      - name: Commit hotfix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/keepz-status-hotfix.yml
          git add lib/features/payment/screens/keepz_native_payment_screen.dart pubspec.yaml
          git commit -m "Use authoritative Keepz payment status"
          git push origin main
