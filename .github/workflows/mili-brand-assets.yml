name: Validate MILI Brand Assets

on:
  push:
    branches: [main]
    paths:
      - 'branding/**'
      - 'assets/font/noto/NotoSansGeorgian-SemiBold.ttf'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'android/app/src/main/res/mipmap-*/**'
      - 'ios/Runner/Assets.xcassets/AppIcon.appiconset/**'
      - '.github/workflows/mili-brand-assets.yml'
  pull_request:
    paths:
      - 'branding/**'
      - 'android/app/src/main/res/mipmap-*/**'
      - 'ios/Runner/Assets.xcassets/AppIcon.appiconset/**'
      - '.github/workflows/mili-brand-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned image-processing dependency
        run: python -m pip install --disable-pip-version-check -r branding/requirements.txt
      - name: Validate committed launcher identity and safe zone
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python branding/test_branding.py
