name: Generate MILI Brand Assets
on:
  push:
    branches: [main]
    paths:
      - 'branding/**'
      - '.github/workflows/mili-brand-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==12.0.0 cairosvg==2.8.2
      - run: python branding/build_assets.py
      - name: Commit generated brand images
        run: |
          git add -u -- assets/image android/app/src/main/res ios/Runner/Assets.xcassets web
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate MILI customer icon, logo and native splash assets"
          git push origin HEAD:main
