name: Checkout recovery checks

on:
  push:
    branches:
      - fix/keepz-payment-resume
  pull_request:
    branches:
      - main

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze checkout repository
        run: flutter analyze lib/features/checkout/domain/repositories/checkout_repository.dart
