name: Validate technical variation UX

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/technical-variation-validation.trigger'
      - '.github/scripts/technical_variation_ux_patch.py'
      - '.github/workflows/technical-variation-ux.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply scoped technical variation patch
        run: python3 .github/scripts/technical_variation_ux_patch.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze technical variation flow
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/features/item/widgets/variation_selector_widget.dart lib/features/item/screens/item_details_screen.dart lib/common/widgets/item_bottom_sheet.dart lib/features/item/controllers/item_controller.dart lib/features/item/domain/services/item_service.dart lib/features/cart/controllers/cart_controller.dart lib/features/cart/domain/services/cart_service.dart

      - name: Commit validated changes to PR branch
        shell: bash
        run: |
          git checkout -- pubspec.lock || true
          rm -f .github/technical-variation-validation.trigger
          rm -f .github/scripts/technical_variation_ux_patch.py
          rm -f .github/workflows/technical-variation-ux.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: refine technical model selection UX"
          git push origin HEAD:${{ github.head_ref }}
