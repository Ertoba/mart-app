name: Trigger product variation fix

on:
  push:
    branches: [main]
    paths:
      - .github/variation-fix-trigger

permissions:
  contents: write

jobs:
  run-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute patch embedded in prepared workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          source = Path('.github/workflows/fix-product-variation-selector.yml').read_text()
          match = re.search(r"python3 - <<'PY'\n(.*?)\n\s+PY\n", source, re.S)
          if not match:
              raise SystemExit('Could not extract prepared patch script')
          code = textwrap.dedent(match.group(1))
          exec(compile(code, 'variation_patch.py', 'exec'))
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format
        run: dart format lib/features/item/controllers/item_controller.dart lib/features/item/screens/item_details_screen.dart lib/common/widgets/item_bottom_sheet.dart lib/features/item/widgets/variation_selector_widget.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze changed Dart files
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/features/item/controllers/item_controller.dart lib/features/item/screens/item_details_screen.dart lib/common/widgets/item_bottom_sheet.dart lib/features/item/widgets/variation_selector_widget.dart

      - name: Commit to main
        shell: bash
        run: |
          rm -f .github/workflows/fix-product-variation-selector.yml
          rm -f .github/workflows/trigger-product-variation-fix.yml
          rm -f .github/variation-fix-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: add safe searchable product variation selection"
          git push origin HEAD:main
