name: V42 Export Source

on:
  push:
    branches: [upgrade-v42-20261002]
    paths: ['.github/workflows/v42-export-source.yml']

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6980453d06bc69d264e417a06b92de8a06e2bd05
      - name: Pack baseline source
        run: |
          tar --exclude=.git --exclude=.dart_tool --exclude=build -czf /tmp/mart-app-v42-baseline.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: mart-app-v42-baseline
          path: /tmp/mart-app-v42-baseline.tar.gz
          retention-days: 1
